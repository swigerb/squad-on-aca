name: Squad dispatch (Actions trigger, ACA control plane)

# Issue #32. Actions is the TRIGGER TRANSPORT and nothing more: it authenticates
# to Azure by OIDC and starts the ACA job. Every decision about whether to run,
# what to run, and whether someone is already running it is made by the SHARED
# dispatch core in worker/lib/, the same code the local CLI, Ralph and Watch use.
#
# Two properties this path buys over a webhook receiver:
#   * no public ingress, no always-on replica, and no stored Azure credential --
#     GitHub requires a 2xx within 10 seconds and does not automatically
#     redeliver failures, which collides badly with scale-to-zero;
#   * the lease is shared, so Ralph's poll and an Actions trigger contend for
#     the same key instead of dispatching the same issue twice.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work
        required: false
      prompt:
        description: Prompt override
        required: false

permissions: {}          # nothing by default; each job asks for exactly what it needs

concurrency:
  # Two rapid triggers on the same issue queue rather than race. This is a
  # convenience, NOT the safety property -- the lease below is what actually
  # prevents a double dispatch, because concurrency groups do not span Ralph.
  group: squad-dispatch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only; this job reads an event and decides
    outputs:
      dispatch: ${{ steps.decide.outputs.dispatch }}
      reason: ${{ steps.decide.outputs.reason }}
      session: ${{ steps.decide.outputs.session }}
      issue: ${{ steps.decide.outputs.issue }}
      prompt: ${{ steps.decide.outputs.prompt }}
      requester: ${{ steps.decide.outputs.requester }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this event is a trigger
        id: decide
        env:
          SQUAD_TRIGGER_LABEL: ${{ vars.SQUAD_TRIGGER_LABEL || 'squad' }}
          SQUAD_COMMAND_PREFIX: ${{ vars.SQUAD_COMMAND_PREFIX || '/squad' }}
          SQUAD_BOT_LOGIN: ${{ vars.SQUAD_BOT_LOGIN || 'squad-on-aca-control-plane[bot]' }}
        run: |
          set -euo pipefail
          verdict="$(node worker/lib/actions-event.js \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --trigger-label "${SQUAD_TRIGGER_LABEL}" \
            --command-prefix "${SQUAD_COMMAND_PREFIX}" \
            --bot-login "${SQUAD_BOT_LOGIN}")"
          echo "verdict: ${verdict}"
          {
            echo "dispatch=$(printf '%s' "$verdict" | jq -r '.dispatch')"
            echo "reason=$(printf '%s' "$verdict" | jq -r '.reason')"
            echo "session=$(printf '%s' "$verdict" | jq -r '.sessionName // ""')"
            echo "issue=$(printf '%s' "$verdict" | jq -r '.issueNumber // ""')"
            echo "prompt=$(printf '%s' "$verdict" | jq -r '.prompt // ""')"
            echo "requester=$(printf '%s' "$verdict" | jq -r '.requester // ""')"
          } >>"$GITHUB_OUTPUT"

      - name: Explain a refusal
        if: steps.decide.outputs.dispatch != 'true'
        run: |
          echo "Not dispatching. Reason: ${{ steps.decide.outputs.reason }}"
          echo "This is a normal outcome for most events in a repository and is NOT a failure."

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC federation to Azure; the ONLY Azure credential
      contents: write   # the durable lease is stored IN this repository, so claiming
                        # one is a WRITE. With contents:read the claim fails with
                        # 'Resource not accessible by integration' (HTTP 403) -- found
                        # by the first live end-to-end run, not by any offline gate.
      issues: write     # apply the shared 'squad-aca:dispatched' marker Ralph also uses
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Claim the shared lease
        id: lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION: ${{ needs.resolve.outputs.session }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
        run: |
          set -euo pipefail
          # The SAME decision core the local CLI, Ralph and Watch use, with
          # `actions` as the dispatch source. The lease is what stops Ralph's
          # five-minute poll and this trigger from starting the same work twice.
          decision="$(node worker/lib/squad-dispatch.js decide \
            --session-id "${SESSION}" \
            --dispatch-source actions \
            --repository "${GITHUB_REPOSITORY}" \
            ${ISSUE:+--issue "${ISSUE}"})"
          echo "$decision" | jq -c '{leaseKey, routing: .routing.route, action}'

          claim="$(printf '%s' "$decision" | node worker/lib/squad-dispatch.js claim --repository "${GITHUB_REPOSITORY}")"
          echo "$claim" | jq -c '.'

          # The claim response carries an `outcome`, NOT a `claimed` boolean.
          # Testing a field that does not exist yields "false" on every run,
          # skips the start step, and reports the whole workflow green having
          # dispatched nothing -- which is exactly what happened on the first
          # live run. The vocabulary is mapped in a tested module rather than in
          # a jq expression no test can reach.
          outcome="$(printf '%s' "$claim" | jq -r '.outcome // ""')"
          verdict="$(node worker/lib/actions-event.js --claim-outcome "$outcome")"
          echo "claim outcome '${outcome}' -> ${verdict}"
          action="$(printf '%s' "$verdict" | jq -r '.action')"

          echo "action=${action}" >>"$GITHUB_OUTPUT"
          echo "leaseKey=$(printf '%s' "$decision" | jq -r '.leaseKey')" >>"$GITHUB_OUTPUT"

          if [ "$action" = "stand-down" ]; then
            echo "Standing down: $(printf '%s' "$verdict" | jq -r '.reason'). This is correct behaviour, not a failure."
          fi

      - name: Start the ACA session job
        if: steps.lease.outputs.action == 'start'
        id: start
        env:
          SESSION: ${{ needs.resolve.outputs.session }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          PROMPT: ${{ needs.resolve.outputs.prompt }}
          REQUESTER: ${{ needs.resolve.outputs.requester }}
          LEASE_KEY: ${{ steps.lease.outputs.leaseKey }}
          BASE_REF: ${{ github.event.repository.default_branch || 'main' }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-squad-aca-dev-eastus2' }}
          JOB: ${{ vars.ACA_SESSION_JOB_NAME || 'caj-squad-aca-session' }}
        run: |
          set -euo pipefail

          # ACA applies a per-execution --env-vars override ONLY when a COMPLETE
          # container spec is supplied: name, image, cpu AND memory. Supply a
          # partial one and the override is silently ignored -- the worker runs
          # with the template's baked-in values, which means SQUAD_MODE=smoke
          # and a session that quietly does nothing while reporting success.
          # Ralph learned this in live E2E; this path must not relearn it.
          spec="$(az containerapp job show -n "$JOB" -g "$RG" \
            --query "properties.template.containers[0]" -o json)"
          name=$(printf '%s' "$spec" | jq -r '.name // ""')
          image=$(printf '%s' "$spec" | jq -r '.image // ""')
          cpu=$(printf '%s' "$spec" | jq -r '.resources.cpu // ""')
          memory=$(printf '%s' "$spec" | jq -r '.resources.memory // ""')

          if [ -z "$image" ] || [ -z "$cpu" ] || [ -z "$memory" ]; then
            echo "The session job template is missing image/cpu/memory. ACA would ignore the env override and run the template defaults, so this dispatch is refused rather than started blind."
            exit 1
          fi

          # SQUAD_MODE=prompt is what Ralph dispatches with. There is no
          # 'issue' mode; an unknown mode exits 64 in the worker.
          prompt="${PROMPT}"
          if [ -z "$prompt" ]; then
            prompt="Work GitHub issue #${ISSUE} in ${GITHUB_REPOSITORY}. Read the issue, implement it, and open a pull request."
          fi

          # Attribution has to reach the AGENT, not just the worker.
          #
          # OV_COMMIT_MESSAGE below only applies when the WORKER commits leftover
          # changes in commit_and_push_if_needed. Measured on a live run: the
          # agent committed its own work and opened its own pull request, so the
          # worker's message -- and its Co-authored-by trailer -- was never used.
          # Telling the agent who asked is the only lever that survives the agent
          # doing the whole job itself.
          if [ -n "${REQUESTER}" ]; then
            prompt="$(printf '%s\n\n%s\n%s' \
              "${prompt}" \
              "This work was requested by @${REQUESTER} on issue #${ISSUE}." \
              "Add the trailer 'Co-authored-by: ${REQUESTER} <${REQUESTER}@users.noreply.github.com>' to every commit you make, and mention who asked in the pull request body.")"
          fi

          # `--env-vars` REPLACES the container's environment; it does not merge.
          # Passing only the overrides silently drops every secret-backed
          # variable in the template -- GITHUB_TOKEN and COPILOT_GITHUB_TOKEN
          # among them -- and the session dies with "No authentication
          # information found" AFTER the image has pulled and the repo cloned.
          # Ralph already solved this; `ralph_build_session_env` merges the
          # template env (values AND secretref: entries) with OV_* overrides and
          # is covered by test_ralph_dispatch.sh. Reusing it beats writing a
          # second merger that would drift.
          source worker/lib/ralph-dispatch.sh

          # Attribution. A commit pushed by the control plane otherwise appears
          # from nowhere: measured, GitHub attributes a commit ENTIRELY by the
          # author email and not at all by the token used to push it, so a
          # trailer is the honest way to record who asked. The requester is a
          # GitHub login taken from the event payload, and it is placed in a
          # trailer rather than the author field so the commit still reads as
          # machine-authored -- which it is.
          # Built with printf rather than a literal multi-line string: inside a
          # YAML block scalar, a line that starts at COLUMN 0 ends the block.
          # A heredoc or an embedded newline here silently produces a workflow
          # GitHub cannot parse -- which is not a failed step but a failed RUN,
          # named after the file rather than the job, and invisible to any check
          # that greps the file instead of parsing it.
          commit_message="Remote Squad session ${SESSION}"
          if [ -n "${REQUESTER}" ]; then
            commit_message="$(printf '%s\n\n%s\n\n%s' \
              "${commit_message}" \
              "Requested by @${REQUESTER} via the Actions trigger on issue #${ISSUE}." \
              "Co-authored-by: ${REQUESTER} <${REQUESTER}@users.noreply.github.com>")"
          fi

          # ralph_build_session_env SKIPS every key in RALPH_MANAGED_ENV_KEYS
          # when copying the template ("if (managed.has(e.name)) continue"), so
          # the caller must supply each managed key itself -- including the
          # secret-backed ones, as `secretref:<secret-name>`. Copying only the
          # non-managed template entries is what produced a session with no
          # GH_TOKEN at all. These overrides deliberately mirror Ralph's own
          # call site so the two dispatchers hand the worker the same shape.
          mapfile -d '' -t start_env < <(
            SJ_ENV="$(printf '%s' "$spec" | jq -c '.env // []')" \
            OV_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            OV_GITHUB_REF="${BASE_REF}" \
            OV_SQUAD_MODE="prompt" \
            OV_SESSION_NAME="$SESSION" \
            OV_SQUAD_POD_ID="$SESSION" \
            OV_SQUAD_DEPLOYMENT_MODE="squad-per-pod" \
            OV_OTEL_SERVICE_NAME="squad-${SESSION}" \
            OV_ENABLE_GITHUB_REMOTE="true" \
            OV_GITHUB_TOKEN="secretref:github-token" \
            OV_COPILOT_GITHUB_TOKEN="secretref:copilot-github-token" \
            OV_OTEL_EXPORTER_OTLP_HEADERS="secretref:otlp-headers" \
            OV_SQUAD_PROMPT="$prompt" \
            OV_PUSH_CHANGES="true" \
            OV_RUN_COPILOT_SMOKE="false" \
            OV_OUTPUT_BRANCH="squad/issue-${ISSUE:-$SESSION}" \
            OV_PR_TITLE="Squad: issue #${ISSUE}" \
            OV_COMMIT_MESSAGE="$commit_message" \
            OV_SQUAD_DISPATCH_SOURCE="actions" \
            OV_SQUAD_LEASE_KEY="$LEASE_KEY" \
            ralph_build_session_env
          )


          # A session that reaches the worker without its credential fails the
          # token preflight two minutes in -- better than minute 55, but it
          # should never get that far from here.
          if ! printf '%s\n' "${start_env[@]}" | grep -q '^GITHUB_TOKEN=secretref:'; then
            echo "The merged environment carries no GITHUB_TOKEN secret reference; refusing to start a session that cannot push."
            exit 1
          fi
          if [ "${#start_env[@]}" -eq 0 ]; then
            echo "The merged session environment is empty; refusing to start a session that would run without its credentials."
            exit 1
          fi

          exec_name=$(az containerapp job start -n "$JOB" -g "$RG" \
            --image "$image" --container-name "${name:-$JOB}" \
            --cpu "$cpu" --memory "$memory" \
            --env-vars "${start_env[@]}" \
            --query name -o tsv)

          echo "exec=${exec_name}" >>"$GITHUB_OUTPUT"
          echo "Started ACA execution: ${exec_name}"
          echo "The control plane is now Azure. This workflow's job is done."

      - name: Mark the issue as dispatched
        if: steps.lease.outputs.action == 'start' && steps.start.outputs.exec != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          DISPATCH_LABEL: ${{ vars.RALPH_DISPATCH_LABEL || 'squad-aca:dispatched' }}
        run: |
          set -euo pipefail
          # The SAME marker Ralph uses. Without it Ralph's five-minute poll finds
          # the issue still unlabelled and dispatches it again once this lease is
          # released -- the lease prevents a CONCURRENT double dispatch, not a
          # sequential one. Applied only after a confirmed start, exactly as
          # Ralph does, so a failed start leaves the issue eligible for retry.
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$DISPATCH_LABEL" \
              || echo "Could not apply ${DISPATCH_LABEL}; Ralph may re-dispatch this issue."
          fi
      - name: Tell the issue where its work went
        if: steps.lease.outputs.action == 'start' && steps.start.outputs.exec != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          EXEC: ${{ steps.start.outputs.exec }}
          SESSION: ${{ needs.resolve.outputs.session }}
        run: |
          set -euo pipefail
          # Without this the requester sees a label change and then silence for
          # anything up to an hour, with no way to tell a running session from a
          # trigger that quietly refused.
          #
          # Posted with GITHUB_TOKEN on purpose: events caused by GITHUB_TOKEN do
          # not start new workflow runs, so this comment cannot retrigger the
          # dispatch. An App token WOULD retrigger it, which is why the resolver
          # also refuses comments from its own identity -- two independent
          # guards, because a runaway here bills by the minute.
          #
          # The body is assembled with printf, NOT written as a literal
          # multi-line string. Inside a YAML block scalar a line beginning at
          # COLUMN 0 ends the block, and a markdown table is all column-0 lines.
          # That mistake does not fail a step -- it makes the whole workflow
          # unparseable, which GitHub reports as a failed run named after the
          # FILE, with no job and no log.
          [ -n "$ISSUE" ] || exit 0
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n\n%s\n' \
            'Dispatched to Azure Container Apps.' \
            '| | |' \
            '|---|---|' \
            "| Session | \`${SESSION}\` |" \
            "| ACA execution | \`${EXEC}\` |" \
            "| Trigger | [this workflow run](${run_url}) |" \
            'The agent runs in Azure. It will push a branch and open a pull request if it has changes to make. Nothing runs on a developer machine.')"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body" \
            || echo "Could not comment on #${ISSUE}; the session is running regardless."

      - name: A claimed lease MUST have produced an execution
        if: steps.lease.outputs.action == 'start'
        env:
          EXEC: ${{ steps.start.outputs.exec }}
        run: |
          set -euo pipefail
          # The last line of defence against the failure this workflow already
          # shipped once: a run that claims a lease, starts nothing, and reports
          # green. If the lease said START, an execution name must exist. This
          # step turns "quietly did nothing" into a red X.
          if [ -z "${EXEC}" ]; then
            echo "The lease was claimed for this issue but NO ACA execution was started."
            echo "The lease is now held by a session that does not exist, so the issue is blocked until it is swept."
            exit 1
          fi
          echo "Confirmed: ACA execution ${EXEC} is running the work."

name: Worker Tests

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'config/**'
      - 'docs/capability-manifest.md'
      - 'docs/examples/squad-capabilities.example.yml'
      - '.github/workflows/worker-tests.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'config/**'
      - 'docs/capability-manifest.md'
      - 'docs/examples/squad-capabilities.example.yml'
      - '.github/workflows/worker-tests.yml'

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check worker sources
        run: |
          node --check worker/lib/parse-capabilities.js
          node --check worker/lib/resolve-capability-route.js
          node --check worker/lib/verify-image-evidence.js
          node --check worker/lib/dispatch-decision.js
          node --check worker/lib/dispatch-lease.js
          node --check worker/lib/squad-dispatch.js
          node --check worker/tests/lib/fake-gh.js
          node -e "JSON.parse(require('fs').readFileSync('config/sandbox-classes.json','utf8'))"
          bash -n worker/lib/squad-capability-preflight.sh
          bash -n worker/tests/test_image_evidence.sh
          bash -n worker/lib/ralph-dispatch.sh
          bash -n worker/entrypoint.sh

      # run-tests.sh reports SKIP for any suite whose declared dependencies are
      # missing (worker/tests/lib/deps.sh) and never counts a skip as a pass. On
      # a CI runner every declared dependency is present, so a skip means the
      # environment regressed and the run proved less than it claims. Fail the
      # job rather than accept a partial green.
      - name: Run worker capability tests
        shell: bash
        run: |
          set -o pipefail
          rc=0
          bash worker/tests/run-tests.sh 2>&1 | tee run-tests.out || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Worker capability tests failed (exit ${rc})."
            exit "$rc"
          fi
          if ! grep -qE 'Suites: [0-9]+ passed, 0 failed, 0 skipped\.' run-tests.out; then
            echo "::error::A worker test suite was SKIPPED on CI. Every declared dependency must be present on the runner; a skip is not a pass."
            exit 1
          fi
          rm -f run-tests.out

      # The worker launch must DETACH. `aca sandbox exec` has a hard ~120s
      # client timeout, so a launch that holds the exec open times out and
      # `create` then tears a healthy 10-60 minute session down two minutes in.
      # Detachment is a shell-grammar property (`&` binds looser than `&&`), so
      # a command containing every character of a detach need not detach, and no
      # substring assertion or stubbed `aca` can tell the two apart. This runs
      # the actually-emitted command in the runner's real bash. It lives here,
      # not in the windows-latest job, because GitHub's Windows runners have no
      # WSL and Git Bash has no `setsid` -- there, the check can only skip.
      #
      # Exit 77 means the probe did not run (worker/tests/lib/deps.sh
      # convention). On a runner with bash that is an environment regression,
      # and a skip is not a pass, so the job fails on it.
      - name: Verify the worker launch actually detaches
        shell: bash
        run: |
          rc=0
          pwsh -NoProfile -File ./scripts/tests/verify-launch-detachment.ps1 || rc=$?
          if [[ "$rc" -eq 77 ]]; then
            echo "::error::The launch-detachment probe was SKIPPED on CI. A skip is not a pass."
            exit 1
          fi
          exit "$rc"

  powershell-validation:
    # scripts/validate.ps1 is the repo's static gate: PowerShell parse, worker
    # bash -n, secret scan, session-managed env parity, and the sync-guard
    # regression tests. Every check is offline - none of it touches Azure - so
    # nothing here needs to be gated on credentials.
    #
    # It runs on windows-latest because validate.ps1 resolves repo paths with
    # Windows separators today, so the ubuntu-latest pwsh cannot execute it
    # unmodified. windows-latest ships pwsh 7 AND Git Bash pre-installed, so
    # PowerShell is never downloaded at test time and the `bash -n` section
    # actually runs instead of skipping. See docs/validation.md.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version (pre-installed, not downloaded)
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run static validation (scripts/validate.ps1)
        run: ./scripts/validate.ps1

      # PR #9 was closed for an observable `squad-aca stop` output regression.
      # validate.ps1 now asserts stop stdout, but the only guard that compares
      # the WHOLE observable surface -- exit code, every az/gh/squad argv, stdout and
      # stderr, across 22 CLI invocations -- is the golden gate. Its sibling,
      # compare-cli-baseline.ps1, needs a second git revision materialised and
      # fails permanently once a CLI change is intended, so it stays a manual
      # developer tool; the goldens are committed, so this runs on every push
      # and pull request. An intended CLI change is a reviewable diff produced
      # by `verify-cli-golden.ps1 -Update`, never a silent behaviour change.
      # Offline: fake az/gh/squad .cmd shims on PATH, synthetic config, no network.
      - name: Verify squad-aca CLI goldens (scripts/tests/verify-cli-golden.ps1)
        run: ./scripts/tests/verify-cli-golden.ps1
